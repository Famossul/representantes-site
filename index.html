<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contatos</title>

<style>

:root{
--verde:#11b611;
--fundo:#e4e4e4;
--card:#ffffff;
--borda:#dcdcdc;
}

body{
margin:0;
font-family:Segoe UI,Roboto,Arial;
background:var(--fundo);
}

header{
background:white;
padding:14px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

header img{
max-width:170px;
}

.container{
width:92%;
max-width:520px;
margin:auto;
margin-top:15px;
background:white;
padding:22px;
border-radius:12px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

h1{
text-align:center;
font-size:1.4rem;
margin-bottom:20px;
}

label{
display:block;
margin-top:12px;
font-weight:600;
}

input,select{
width:100%;
padding:12px;
margin-top:6px;
border-radius:8px;
border:1px solid var(--borda);
font-size:15px;
box-sizing:border-box;
}

/* lista cidades */

.lista-cidades{
position:relative;
}

#cidadeLista{
position:absolute;
width:100%;
background:white;
border:1px solid var(--borda);
border-radius:8px;
max-height:200px;
overflow-y:auto;
display:none;
z-index:1000;
}

.cidade-item{
padding:10px;
cursor:pointer;
}

.cidade-item:hover{
background:#f0f0f0;
}

/* mensagem */

.mensagem{
margin-top:18px;
padding:16px;
background:#f4fff4;
border:1px solid #bfe6bf;
border-left:6px solid var(--verde);
border-radius:10px;
text-align:center;
display:none;
}

/* card */

.card{
margin-top:15px;
padding:16px;
border-radius:12px;
border:1px solid var(--borda);
background:#fafafa;
}

.card strong{
font-size:17px;
}

.card span{
display:block;
margin-top:6px;
}

.card a{
text-decoration:none;
color:black;
}

.whats{
display:flex;
align-items:center;
gap:8px;
font-weight:500;
}

.whats img{
width:22px;
}

/* ações */

.acoes{
margin-top:10px;
display:flex;
gap:8px;
flex-wrap:wrap;
}

.btn{
padding:6px 10px;
border-radius:6px;
font-size:13px;
border:1px solid var(--borda);
background:white;
cursor:pointer;
}

.btn:hover{
background:#f0f0f0;
}

/* botão whatsapp */

#btn-flutuante{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
background:var(--verde);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 4px 10px rgba(0,0,0,.3);
}

#btn-flutuante img{
width:32px;
}

</style>
</head>

<body>

<header>
<a href="https://famossul.com.br/" target="_blank">
<img src="famossul-branco.png">
</a>
</header>

<main class="container">

<h1>Nossos canais de atendimento</h1>

<label>Área</label>
<select id="area">
<option value="">Selecione</option>
<option value="logistica">Logística</option>
<option value="rastreio">Rastreio</option>
<option value="sac">SAC</option>
<option value="comercial">Comercial</option>
</select>

<div id="subareaBox" style="display:none">

<label>Produto</label>

<select id="subarea">
<option value="">Selecione</option>
<option value="portas">Portas e Componentes</option>
<option value="forro">Forro Vinílico</option>
</select>

</div>

<div id="buscaCidadeBox" style="display:none">

<label>Buscar cidade</label>

<div class="lista-cidades">
<input id="cidadeBusca" placeholder="Digite sua cidade">
<div id="cidadeLista"></div>
</div>

</div>

<div id="mensagem" class="mensagem">
Agradecemos seu contato! Segue abaixo o contato de nosso representante mais próximo para melhor atendê-lo(a).
</div>

<div id="contato"></div>

</main>

<a href="https://wa.me/5541995030522" target="_blank" id="btn-flutuante">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>

<script>

const area=document.getElementById("area")
const subarea=document.getElementById("subarea")

const subareaBox=document.getElementById("subareaBox")
const buscaCidadeBox=document.getElementById("buscaCidadeBox")

const cidadeBusca=document.getElementById("cidadeBusca")
const cidadeLista=document.getElementById("cidadeLista")

const contato=document.getElementById("contato")
const mensagem=document.getElementById("mensagem")

let dados
let cidades=[]

fetch("representantes.json")
.then(r=>r.json())
.then(json=>{

dados=json

Object.keys(json).forEach(regiao=>{

Object.keys(json[regiao]).forEach(estado=>{

Object.keys(json[regiao][estado]).forEach(cidade=>{

cidades.push({
cidade:cidade,
estado:estado,
regiao:regiao
})

})

})

})

})

area.onchange=()=>{

contato.innerHTML=""
mensagem.style.display="none"

if(area.value==="comercial"){

subareaBox.style.display="block"

}else{

subareaBox.style.display="none"
buscaCidadeBox.style.display="none"

mostrarAreaSimples()

}

}

subarea.onchange=()=>{

contato.innerHTML=""
mensagem.style.display="none"

if(subarea.value==="portas"){

buscaCidadeBox.style.display="block"

}

if(subarea.value==="forro"){

buscaCidadeBox.style.display="none"

mostrarForro()

}

}

function mostrarAreaSimples(){

const dadosFixos={
logistica:[
{nome:"Luan",telefone:"4799989145",email:"logistica@famossul.com.br"},
{nome:"Mayron",telefone:"41988139380",email:"logistica1@famossul.com.br"}
],
rastreio:[
{nome:"Graziela",telefone:"41995030522",email:"entregas@famossul.com.br"}
],
sac:[
{nome:"Carlos",telefone:"41988957643",email:"tecnico@famossul.com.br"}
]
}

dadosFixos[area.value].forEach(r=>contato.innerHTML+=card(r))

mensagem.style.display="block"

}

function mostrarForro(){

const reps=[
{
nome:"Tetto Revest",
telefone:"41987279981",
email:"vendas1@tettorevest.com.br"
}
]

mensagem.style.display="block"

reps.forEach(rep=>{

contato.innerHTML+=card(rep)

})

}

cidadeBusca.oninput=()=>{

let termo=cidadeBusca.value.toLowerCase()

let filtradas=cidades.filter(c=>
c.cidade.toLowerCase().includes(termo)
).slice(0,50)

cidadeLista.innerHTML=""

filtradas.forEach(c=>{

let div=document.createElement("div")

div.className="cidade-item"
div.textContent=c.cidade+" - "+c.estado

div.onclick=()=>{

cidadeBusca.value=c.cidade
cidadeLista.style.display="none"

mostrarRepresentantes(c)

}

cidadeLista.appendChild(div)

})

cidadeLista.style.display="block"

}

function mostrarRepresentantes(local){

contato.innerHTML=""

let reps=dados[local.regiao][local.estado][local.cidade]

mensagem.style.display="block"

reps.forEach(rep=>{

contato.innerHTML+=card(rep)

})

}

function copiar(texto){

navigator.clipboard.writeText(texto)

alert("Copiado!")

}

function card(rep){

let numero=rep.telefone.replace(/\D/g,"")

let msg=encodeURIComponent("Olá, gostaria de atendimento.")

return `

<div class="card">

<strong>${rep.nome}</strong>

<span class="whats">
<a target="_blank" href="https://wa.me/55${numero}?text=${msg}">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
${rep.telefone}
</a>
</span>

${rep.email ? `<span>📧 <a href="mailto:${rep.email}">${rep.email}</a></span>` : ""}

<div class="acoes">

<button class="btn" onclick="copiar('${rep.telefone}')">
Copiar telefone
</button>

${rep.email ? `<button class="btn" onclick="copiar('${rep.email}')">
Copiar email
</button>` : ""}

</div>

</div>

`

}

</script>

</body>
</html>
